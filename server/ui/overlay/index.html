<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dione Dynamic Island</title>
  <style>
    :root {
      --bg-glass: rgba(15, 17, 26, 0.82);
      --border-glow: rgba(147, 51, 234, 0.35);
      --neon-cyan: #06b6d4;
      --neon-purple: #a855f7;
      --neon-magenta: #ec4899;
      --neon-amber: #f59e0b;
      --neon-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }

    body {
      background: transparent;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 10px;
      height: 100vh;
    }

    /* Floating Island Container */
    .island-container {
      background: var(--bg-glass);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65), 0 0 24px rgba(168, 85, 247, 0.25);
      border-radius: 28px;
      padding: 8px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      width: 290px;
      max-width: 95vw;
      color: var(--text-main);
      cursor: grab;
      -webkit-app-region: drag; /* Allows dragging the window on Windows */
    }

    .island-container.expanded {
      width: 440px;
      border-radius: 24px;
      padding: 14px 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 32px rgba(6, 182, 212, 0.3);
    }

    /* Top Header Bar */
    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Glowing Orb */
    .orb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #c084fc, #7e22ce);
      box-shadow: 0 0 16px #a855f7;
      transition: all 0.4s ease;
      flex-shrink: 0;
    }

    .orb.listening {
      background: radial-gradient(circle at 30% 30%, #67e8f9, #0891b2);
      box-shadow: 0 0 20px var(--neon-cyan);
      animation: pulse 1.2s infinite alternate ease-in-out;
    }

    .orb.thinking {
      background: radial-gradient(circle at 30% 30%, #fde047, #d97706);
      box-shadow: 0 0 20px var(--neon-amber);
      animation: pulse 0.8s infinite alternate ease-in-out;
    }

    .orb.acting {
      background: radial-gradient(circle at 30% 30%, #f472b6, #db2777);
      box-shadow: 0 0 20px var(--neon-magenta);
      animation: spin-pulse 2s infinite linear;
    }

    .orb.speaking {
      background: radial-gradient(circle at 30% 30%, #4ade80, #16a34a);
      box-shadow: 0 0 20px #22c55e;
      animation: pulse 1s infinite alternate ease-in-out;
    }

    .orb.paused {
      background: radial-gradient(circle at 30% 30%, #f87171, #dc2626);
      box-shadow: 0 0 20px var(--neon-red);
    }

    @keyframes pulse {
      0% { transform: scale(0.92); opacity: 0.8; }
      100% { transform: scale(1.18); opacity: 1; }
    }

    @keyframes spin-pulse {
      0% { transform: rotate(0deg) scale(0.95); }
      50% { transform: rotate(180deg) scale(1.15); }
      100% { transform: rotate(360deg) scale(0.95); }
    }

    .title-box {
      display: flex;
      flex-direction: column;
    }

    .app-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #f8fafc, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-text {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
    }

    /* Actions Right */
    .controls-right {
      display: flex;
      align-items: center;
      gap: 8px;
      -webkit-app-region: no-drag;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 13px;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.08);
    }

    .stop-btn {
      background: rgba(239, 68, 68, 0.25);
      border-color: rgba(239, 68, 68, 0.5);
      color: #fca5a5;
    }

    .stop-btn:hover {
      background: rgba(239, 68, 68, 0.6);
      color: white;
    }

    /* Waveform Canvas */
    .waveform-canvas {
      width: 100%;
      height: 24px;
      border-radius: 8px;
      display: block;
    }

    /* Expanded Content Panel */
    .details-panel {
      display: none;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 10px;
      -webkit-app-region: no-drag;
    }

    .expanded .details-panel {
      display: flex;
    }

    .speech-box {
      background: rgba(0, 0, 0, 0.35);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 13px;
      line-height: 1.4;
      border: 1px solid rgba(255, 255, 255, 0.06);
      max-height: 90px;
      overflow-y: auto;
    }

    .speech-box .filler {
      color: #c084fc;
      font-style: italic;
      display: block;
      margin-bottom: 4px;
    }

    .speech-box .response {
      color: #f1f5f9;
    }

    /* Tool Badge */
    .tool-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(6, 182, 212, 0.15);
      border: 1px solid rgba(6, 182, 212, 0.35);
      color: #67e8f9;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      width: fit-content;
    }

    /* Input Box */
    .input-bar {
      display: flex;
      gap: 8px;
    }

    .text-input {
      flex: 1;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 8px 12px;
      color: white;
      font-size: 12px;
      outline: none;
      transition: border 0.2s;
    }

    .text-input:focus {
      border-color: var(--neon-purple);
    }

    .send-btn {
      background: linear-gradient(135deg, #9333ea, #7c3aed);
      border: none;
      color: white;
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="island-container" id="island">
    <!-- Top Header Bar -->
    <div class="header-bar">
      <div class="status-left">
        <div class="orb" id="orb"></div>
        <div class="title-box">
          <span class="app-title">Dione AI</span>
          <span class="status-text" id="statusText">Ready & Listening</span>
        </div>
      </div>
      <div class="controls-right">
        <button class="icon-btn" id="micBtn" title="Speak to Dione">🎙️</button>
        <button class="icon-btn" id="toggleExpandBtn" title="Toggle Detail">▼</button>
        <button class="icon-btn stop-btn" id="stopBtn" title="Emergency Stop (Esc)">✕</button>
      </div>
    </div>

    <!-- Reactive Audio Waveform -->
    <canvas class="waveform-canvas" id="waveCanvas"></canvas>

    <!-- Expanded Details Panel -->
    <div class="details-panel" id="details">
      <div class="tool-badge" id="toolBadge" style="display: none;">
        <span>⚡</span> <span id="toolName">ComputerUse.launch_app</span>
      </div>

      <div class="speech-box" id="speechBox">
        <span class="filler" id="fillerText">"Hmm, let me look into that for you..."</span>
        <span class="response" id="responseText">I'm ready to manage your PC and run autonomous tasks.</span>
      </div>

      <div class="input-bar">
        <input type="text" class="text-input" id="goalInput" placeholder="Tell Dione what to do (e.g. 'Open Spotify')..." />
        <button class="send-btn" id="sendBtn">Execute</button>
      </div>
    </div>
  </div>

  <script>
    const island = document.getElementById('island');
    const orb = document.getElementById('orb');
    const statusText = document.getElementById('statusText');
    const toggleExpandBtn = document.getElementById('toggleExpandBtn');
    const micBtn = document.getElementById('micBtn');
    const stopBtn = document.getElementById('stopBtn');
    const waveCanvas = document.getElementById('waveCanvas');
    const toolBadge = document.getElementById('toolBadge');
    const toolName = document.getElementById('toolName');
    const fillerText = document.getElementById('fillerText');
    const responseText = document.getElementById('responseText');
    const goalInput = document.getElementById('goalInput');
    const sendBtn = document.getElementById('sendBtn');

    let isExpanded = false;
    let currentState = 'idle';

    // Toggle expansion
    toggleExpandBtn.addEventListener('click', () => {
      isExpanded = !isExpanded;
      island.classList.toggle('expanded', isExpanded);
      toggleExpandBtn.textContent = isExpanded ? '▲' : '▼';
      if (window.pywebview) {
        window.pywebview.api.set_window_size(isExpanded ? 460 : 310, isExpanded ? 240 : 80);
      }
    });

    // Emergency Stop
    stopBtn.addEventListener('click', () => {
      if (window.pywebview) {
        window.pywebview.api.emergency_stop();
      }
      updateUIState('paused', 'Emergency Stop Triggered');
    });

    // Execute Goal
    function triggerGoal() {
      const text = goalInput.value.trim();
      if (!text) return;
      if (!isExpanded) {
        toggleExpandBtn.click();
      }
      goalInput.value = '';
      if (window.pywebview) {
        window.pywebview.api.submit_goal(text);
      }
    }

    sendBtn.addEventListener('click', triggerGoal);
    goalInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') triggerGoal();
    });

    // Mic Button
    micBtn.addEventListener('click', () => {
      if (window.pywebview) {
        window.pywebview.api.start_voice_capture();
      }
    });

    // Global Python Event Receiver
    window.receiveDioneEvent = function(event) {
      console.log('Event from Python:', event);
      if (event.type === 'state_changed') {
        updateUIState(event.payload.to, event.payload.reason || '');
      } else if (event.type === 'speech_chunk') {
        if (event.payload.is_filler) {
          fillerText.textContent = `"${event.payload.text}"`;
          fillerText.style.display = 'block';
        } else {
          responseText.textContent = event.payload.text;
        }
      } else if (event.type === 'tool_dispatched') {
        toolBadge.style.display = 'inline-flex';
        toolName.textContent = event.payload.tool;
      } else if (event.type === 'tool_completed') {
        toolBadge.style.display = 'none';
      }
    };

    function updateUIState(state, desc) {
      currentState = state;
      orb.className = 'orb ' + state;
      statusText.textContent = desc || (state.charAt(0).toUpperCase() + state.slice(1));
    }

    // Audio Waveform Animation
    const ctx = waveCanvas.getContext('2d');
    waveCanvas.width = 300;
    waveCanvas.height = 30;

    let step = 0;
    function renderWave() {
      ctx.clearRect(0, 0, waveCanvas.width, waveCanvas.height);
      const width = waveCanvas.width;
      const height = waveCanvas.height;
      const cy = height / 2;

      let color = 'rgba(168, 85, 247, 0.4)';
      let amp = 2;
      let freq = 0.05;

      if (currentState === 'speaking') {
        color = 'rgba(74, 222, 128, 0.85)';
        amp = 7;
        freq = 0.08;
      } else if (currentState === 'listening') {
        color = 'rgba(6, 182, 212, 0.85)';
        amp = 9;
        freq = 0.12;
      } else if (currentState === 'thinking' || currentState === 'acting') {
        color = 'rgba(245, 158, 11, 0.75)';
        amp = 4;
        freq = 0.07;
      }

      ctx.beginPath();
      ctx.moveTo(0, cy);
      for (let x = 0; x < width; x += 3) {
        const y = cy + Math.sin(x * freq + step) * amp * Math.sin(x / width * Math.PI);
        ctx.lineTo(x, y);
      }
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.stroke();

      step += 0.08;
      requestAnimationFrame(renderWave);
    }
    renderWave();
  </script>
</body>
</html>
